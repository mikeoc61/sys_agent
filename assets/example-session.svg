<svg xmlns="http://www.w3.org/2000/svg" width="888" height="607" viewBox="0 0 888 607" font-family="ui-monospace, 'SF Mono', 'Menlo', 'DejaVu Sans Mono', 'Cascadia Code', 'Consolas', monospace" font-size="14">
  <rect width="888" height="607" rx="11" fill="#0d1117"/>
  <rect width="888" height="38" fill="#161b22"/>
  <rect y="37" width="888" height="1" fill="#21262d"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19" r="6" fill="#febc2e"/>
  <circle cx="62" cy="19" r="6" fill="#28c840"/>
  <text x="444" y="23" fill="#6e7681" font-size="12.5" text-anchor="middle">mikeoc@raspberrypi: ~</text>
  <text x="22" y="62" xml:space="preserve"><tspan fill="#6e7681">[deepseek-flash] </tspan><tspan fill="#56d4dd" font-weight="600">you@raspberrypi&gt;</tspan><tspan fill="#c9d1d9"> How much disk space do I have left?</tspan></text>
  <text x="22" y="83" xml:space="preserve"><tspan fill="#6e7681">────────────────────────────────────────────────────────────────────────</tspan></text>
  <text x="22" y="104" xml:space="preserve"><tspan fill="#ffd866" font-weight="600">COMMAND:</tspan><tspan fill="#c9d1d9">  df -h -x tmpfs -x devtmpfs</tspan></text>
  <text x="22" y="125" xml:space="preserve"><tspan fill="#c9d1d9">REASON:   Show live free/used space on all real mounted filesystems.</tspan></text>
  <text x="22" y="146" xml:space="preserve"><tspan fill="#6e7681">CWD:      /home/mikeoc</tspan></text>
  <text x="22" y="167" xml:space="preserve"><tspan fill="#6e7681">────────────────────────────────────────────────────────────────────────</tspan></text>
  <text x="22" y="188" xml:space="preserve"><tspan fill="#e3b341" font-weight="600">Run? [y]es / [n]o / [e]dit / [q]uit-workflow: </tspan><tspan fill="#c9d1d9">y</tspan></text>
  <text x="22" y="209" xml:space="preserve"><tspan fill="#7ee787">[exit=0]</tspan></text>
  <text x="22" y="230" xml:space="preserve"><tspan fill="#c9d1d9">Filesystem      Size  Used Avail Use% Mounted on</tspan></text>
  <text x="22" y="251" xml:space="preserve"><tspan fill="#c9d1d9">/dev/nvme0n1p2  234G   31G  191G  14% /</tspan></text>
  <text x="22" y="272" xml:space="preserve"><tspan fill="#c9d1d9">/dev/nvme0n1p1  511M   81M  431M  16% /boot/firmware</tspan></text>
  <text x="22" y="293" xml:space="preserve"><tspan fill="#c9d1d9">/dev/sda1       1.8T  897G  918G  50% /media/mikeoc/T72GB</tspan></text>
  <text x="22" y="314" xml:space="preserve"><tspan fill="#7ee787" font-weight="600">agent&gt;</tspan><tspan fill="#c9d1d9"> Here's your live disk space:</tspan></text>
  <text x="22" y="335" xml:space="preserve"><tspan fill="#c9d1d9">| Filesystem | Mount | Size | Used | Available | Use % |</tspan></text>
  <text x="22" y="356" xml:space="preserve"><tspan fill="#c9d1d9">|---|---|---|---|---|---|</tspan></text>
  <text x="22" y="377" xml:space="preserve"><tspan fill="#c9d1d9">| `/dev/nvme0n1p2` | `/` (root) | 234G | 31G | **191G** | 14% |</tspan></text>
  <text x="22" y="398" xml:space="preserve"><tspan fill="#c9d1d9">| `/dev/nvme0n1p1` | `/boot/firmware` | 511M | 81M | **431M** | 16% |</tspan></text>
  <text x="22" y="419" xml:space="preserve"><tspan fill="#c9d1d9">| `/dev/sda1` | `/media/mikeoc/T72GB` | 1.8T | 897G | **918G** | 50% |</tspan></text>
  <text x="22" y="440" xml:space="preserve"><tspan fill="#c9d1d9">**Bottom line:** plenty of room. About **1.1 TB free total** — 191G on the NVMe system drive and</tspan></text>
  <text x="22" y="461" xml:space="preserve"><tspan fill="#c9d1d9">918G on the USB T7 drive.</tspan></text>
  <text x="22" y="482" xml:space="preserve"><tspan fill="#c9d1d9">Two notes:</tspan></text>
  <text x="22" y="503" xml:space="preserve"><tspan fill="#c9d1d9">- The NVMe root and `/boot/firmware` are both partitions of the same 256GB Patriot M.2, so that</tspan></text>
  <text x="22" y="524" xml:space="preserve"><tspan fill="#c9d1d9">~1.1TB is spread over two physical devices (Patriot NVMe + Samsung T7 USB SSD).</tspan></text>
  <text x="22" y="545" xml:space="preserve"><tspan fill="#c9d1d9">- Boot firmware at 16% is worth keeping an eye on if you install new kernels, but 431M free is</tspan></text>
  <text x="22" y="566" xml:space="preserve"><tspan fill="#c9d1d9">fine for now.</tspan></text>
</svg>
