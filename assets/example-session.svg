<text x="18" y="44" xml:space="preserve"><tspan fill="#d4d4d4">$ sys_agent</tspan></text>
<text x="18" y="65" xml:space="preserve"><tspan fill="#7a7a7a">[loaded 2 vars from ~/.config/sys_agent/.env]</tspan></text>
<text x="18" y="86" xml:space="preserve"><tspan fill="#4ec9d4" font-weight="bold">sys_agent  provider=anthropic  model=claude-haiku-4-5-20251001  host=pi5 (Linux/aarch64)</tspan></text>
<text x="18" y="107" xml:space="preserve"><tspan fill="#7a7a7a">meta: /help  /info  /reset  /auto on|off  /tokens on|off  /color on|off  /exit, /quit</tspan></text>
<text x="18" y="149" xml:space="preserve"><tspan fill="#4ec9d4" font-weight="bold">you&gt;</tspan><tspan fill="#d4d4d4"> what&#x27;s eating disk on /var?</tspan></text>
<text x="18" y="191" xml:space="preserve"><tspan fill="#7a7a7a">──────────────────────────────────────────────────────────</tspan></text>
<text x="18" y="212" xml:space="preserve"><tspan fill="#e5c07b" font-weight="bold">COMMAND:</tspan><tspan fill="#d4d4d4">  sudo du -sh /var/* 2&gt;/dev/null | sort -rh | head -10</tspan></text>
<text x="18" y="233" xml:space="preserve"><tspan fill="#d4d4d4">REASON:   List the largest top-level subdirs under /var</tspan></text>
<text x="18" y="254" xml:space="preserve"><tspan fill="#7a7a7a">CWD:      /home/mikeoc</tspan></text>
<text x="18" y="275" xml:space="preserve"><tspan fill="#7a7a7a">──────────────────────────────────────────────────────────</tspan></text>
<text x="18" y="296" xml:space="preserve"><tspan fill="#d7ba7d" font-weight="bold">Run? [y]es / [n]o / [e]dit / [q]uit:</tspan><tspan fill="#d4d4d4"> y</tspan></text>
<text x="18" y="317" xml:space="preserve"><tspan fill="#6ac779">[exit=0]</tspan></text>
<text x="18" y="338" xml:space="preserve"><tspan fill="#d4d4d4">1.4G  /var/lib</tspan></text>
<text x="18" y="359" xml:space="preserve"><tspan fill="#d4d4d4">820M  /var/log</tspan></text>
<text x="18" y="380" xml:space="preserve"><tspan fill="#d4d4d4">...</tspan></text>
<text x="18" y="422" xml:space="preserve"><tspan fill="#6ac779" font-weight="bold">agent&gt;</tspan><tspan fill="#d4d4d4"> /var/lib dominates at 1.4G. Want me to break that down next?</tspan></text>
