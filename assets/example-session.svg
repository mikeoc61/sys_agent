<svg xmlns="http://www.w3.org/2000/svg" width="855" height="607" viewBox="0 0 855 607" font-family="ui-monospace, 'SF Mono', 'Menlo', 'DejaVu Sans Mono', 'Cascadia Code', 'Consolas', monospace" font-size="14">
  <rect x="0" y="0" width="855" height="607" rx="11" fill="#0d1117"/>
  <rect x="0" y="0" width="855" height="38" fill="#161b22"/>
  <rect x="0" y="37" width="855" height="1" fill="#21262d"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19" r="6" fill="#febc2e"/>
  <circle cx="62" cy="19" r="6" fill="#28c840"/>
  <text x="427" y="23" fill="#6e7681" font-size="12.5" text-anchor="middle">pi@raspberrypi: ~/sys_agent</text>
  <text x="22" y="62" xml:space="preserve"><tspan fill="#56d4dd" font-weight="600">sys_agent  provider=anthropic  model=claude-haiku-4-5-20251001  host=raspberrypi (Linux/aarch64)</tspan></text>
  <text x="22" y="83" xml:space="preserve"><tspan fill="#6e7681">meta: /help /info /auto /thinking /effort /history /provider /model /facts  — /help for details</tspan></text>
  <text x="22" y="125" xml:space="preserve"><tspan fill="#56d4dd" font-weight="600">you@raspberrypi&gt;</tspan><tspan fill="#c9d1d9"> why is bitcoind eating so much memory?</tspan></text>
  <text x="22" y="167" xml:space="preserve"><tspan fill="#6e7681">  │ Checking live service state and RSS before trusting the startup</tspan></text>
  <text x="22" y="188" xml:space="preserve"><tspan fill="#6e7681">  │ snapshot — a process hot at launch can be idle now.</tspan></text>
  <text x="22" y="230" xml:space="preserve"><tspan fill="#6e7681">────────────────────────────────────────────────────────────────────────</tspan></text>
  <text x="22" y="251" xml:space="preserve"><tspan fill="#ffd866" font-weight="600">COMMAND:</tspan><tspan fill="#c9d1d9">  systemctl status bitcoind --no-pager</tspan></text>
  <text x="22" y="272" xml:space="preserve"><tspan fill="#c9d1d9">REASON:   Check service state, uptime, and resident memory</tspan></text>
  <text x="22" y="293" xml:space="preserve"><tspan fill="#6e7681">CWD:      /home/pi</tspan></text>
  <text x="22" y="314" xml:space="preserve"><tspan fill="#6e7681">────────────────────────────────────────────────────────────────────────</tspan></text>
  <text x="22" y="335" xml:space="preserve"><tspan fill="#e3b341" font-weight="600">Run? [y]es / [n]o / [e]dit / [q]uit-workflow: </tspan><tspan fill="#c9d1d9">y</tspan></text>
  <text x="22" y="356" xml:space="preserve"><tspan fill="#7ee787">[exit=0]</tspan></text>
  <text x="22" y="377" xml:space="preserve"><tspan fill="#c9d1d9">● bitcoind.service - Bitcoin daemon</tspan></text>
  <text x="22" y="398" xml:space="preserve"><tspan fill="#c9d1d9">     Active: active (running) since Mon 2026-06-01; 5 days ago</tspan></text>
  <text x="22" y="419" xml:space="preserve"><tspan fill="#c9d1d9">     Memory: 1.4G   Tasks: 14   CPU: 2h 11min</tspan></text>
  <text x="22" y="461" xml:space="preserve"><tspan fill="#7ee787" font-weight="600">agent&gt;</tspan><tspan fill="#c9d1d9"> bitcoind is healthy — 1.4 GB resident is normal for a fully synced</tspan></text>
  <text x="22" y="482" xml:space="preserve"><tspan fill="#c9d1d9">        node with a large dbcache. No leak; this is expected steady state.</tspan></text>
  <text x="22" y="524" xml:space="preserve"><tspan fill="#56d4dd" font-weight="600">you@raspberrypi&gt;</tspan><tspan fill="#c9d1d9"> now tail its debug log for recent warnings</tspan></text>
  <text x="22" y="566" xml:space="preserve"><tspan fill="#6e7681">/ thinking… 2s</tspan></text>
</svg>